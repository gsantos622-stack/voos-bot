name: Voos Bot

on:
  schedule:
    - cron: "0 0,12 * * *"  # 2 rodadas/dia (00h e 12h UTC) — 4 destinos cada, cabe na cota free
  workflow_dispatch:        # permite rodar manualmente na aba "Actions"
    inputs:
      origem_fixa:
        description: "Origem (ex: GRU). Vazio = usa a rotacao padrão"
        required: false
        default: ""
      focar_destinos:
        description: "Focar destinos (IATA separados por virgula). Ex: MAD,BCN (Europa) | NRT,TYO (Japao). Vazio = pool padrão"
        required: false
        default: ""
      mes_alvo:
        description: "Mes a buscar (AAAA-MM). Vazio = proximo mes"
        required: false
        default: ""
      outbound_date:
        description: "Ida no dia exato (AAAA-MM-DD). Sobrepõe mes_alvo"
        required: false
        default: ""
      return_date:
        description: "Volta no dia exato (AAAA-MM-DD) — junto com outbound_date"
        required: false
        default: ""

concurrency:
  group: voos-bot
  cancel-in-progress: false

env:
  ORIGENS_ROTACAO: ${{ vars.ORIGENS_ROTACAO || 'GRU,GRU,CGH' }}
  DESTINOS_POOL: ${{ vars.DESTINOS_POOL || 'MIA,FLL,JFK,MCO,LAX,CDG,LIS,MAD,BCN,LHR,FCO,MXP,AMS,OPO,NRT,HND,KIX,CUN,PUJ,MBJ,CUR,GIG,SSA,FOR,REC,NAT,FLN' }}
  DESTINOS_POR_EXECUCAO: ${{ vars.DESTINOS_POR_EXECUCAO || '4' }}
  MAX_PRECO: ${{ vars.MAX_PRECO || '3500' }}
  MAX_MENSAGENS: ${{ vars.MAX_MENSAGENS || '5' }}
  MAX_ESCALAS: ${{ vars.MAX_ESCALAS || '2' }}
  TIPO_VOO: ${{ vars.TIPO_VOO || '1' }}
  MES_ALVO: ${{ inputs.mes_alvo || vars.MES_ALVO || '' }}
  OUTBOUND_DATE: ${{ inputs.outbound_date || vars.OUTBOUND_DATE || '' }}
  RETURN_DATE: ${{ inputs.return_date || vars.RETURN_DATE || '' }}
  ORIGEM_FIXA: ${{ inputs.origem_fixa || '' }}
  DESTINOS_FOCADOS: ${{ inputs.focar_destinos || '' }}
  FONTE_VOO: ${{ vars.FONTE_VOO || '' }}
  FORCAR_BUSCA: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}

jobs:
  voos:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restaurar cache de ofertas (dedupe)
        uses: actions/cache@v5
        with:
          path: cache
          key: voos-cache-${{ github.run_id }}
          restore-keys: |
            voos-cache-

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar o bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GETYOURGUIDE_PARTNER_ID: ${{ secrets.GETYOURGUIDE_PARTNER_ID }}
          AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
        run: python main.py

      - name: Gerar pagina de ofertas
        run: python gerar_site.py

      - name: Upload para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar (deploy)
        uses: actions/deploy-pages@v4